name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - .github/**
  pull_request:
    paths:
      - .github/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          gh release download "v${ACTIONLINT_VERSION}" -R rhysd/actionlint \
            -p "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -p "actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            -D "${RUNNER_TEMP}/actionlint"
          cd "${RUNNER_TEMP}/actionlint"
          sha256sum --ignore-missing -c "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          GH_TOKEN: ${{ github.token }}
      - run: '"${RUNNER_TEMP}/actionlint/actionlint" -color'

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  pinact:
    name: pinact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"

  ghalint:
    name: ghalint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ghalint
        run: |
          gh release download "v${GHALINT_VERSION}" -R suzuki-shunsuke/ghalint \
            -p "ghalint_${GHALINT_VERSION}_linux_amd64.tar.gz" \
            -p "ghalint_${GHALINT_VERSION}_checksums.txt" \
            -D "${RUNNER_TEMP}/ghalint"
          cd "${RUNNER_TEMP}/ghalint"
          sha256sum --ignore-missing -c "ghalint_${GHALINT_VERSION}_checksums.txt"
          tar xzf "ghalint_${GHALINT_VERSION}_linux_amd64.tar.gz" ghalint
        env:
          GHALINT_VERSION: 1.5.6
          GH_TOKEN: ${{ github.token }}
      - run: '"${RUNNER_TEMP}/ghalint/ghalint" run'
