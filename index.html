<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masu</title>
    <meta
      name="description"
      content="A spreadsheet editor that runs entirely in your browser. No server, no cloud."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Masu" />
    <meta
      property="og:description"
      content="A spreadsheet editor that runs entirely in your browser. No server, no cloud."
    />
    <meta property="og:url" content="https://hytfjwr.github.io/Masu/" />
    <meta property="og:image" content="https://hytfjwr.github.io/Masu/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        // (the pre-rename keys are still read here: this runs before src/utils/storageKeys migrates it)
        var theme =
          localStorage.getItem('masu-theme') ||
          localStorage.getItem('tabula-theme') ||
          localStorage.getItem('sheetcraft-theme') ||
          'auto';
        if (
          theme === 'dark' ||
          (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
        // SVG-filter refraction in backdrop-filter is Chromium-only; others get plain frosted glass
        var brands = navigator.userAgentData && navigator.userAgentData.brands;
        if (
          brands &&
          brands.some(function (b) {
            return /Chromium/.test(b.brand);
          })
        ) {
          document.documentElement.classList.add('lg-lens');
        }
      })();
    </script>
    <!-- Splash screen: inlined so it plays before the JS bundle loads. Story: =CONCAT(A1, B1) is
         entered, the 4×2 range is selected and merged, and the merged cell shows the result. On exit
         (src/splash.ts) the app opens out of the merged cell, iOS app-launch style. -->
    <style>
      #splash {
        --sp-bg: #f5f5f7;
        --sp-face: #ffffff;
        --sp-line: rgba(0, 0, 0, 0.08);
        --sp-edge: rgba(0, 0, 0, 0.06);
        --sp-text: #1d1d1f;
        --sp-muted: #86868b;
        --sp-blue: #3b82f6;
        --sp-green: #10b981;
        --sp-gridline: rgba(15, 23, 42, 0.09);
        --sp-glass: rgba(255, 255, 255, 0.32);
        --sp-rim-hi: rgba(255, 255, 255, 0.95);
        --sp-rim-lo: rgba(255, 255, 255, 0.4);
        --sp-rim: rgba(255, 255, 255, 0.5);
        --sp-inner: rgba(255, 255, 255, 0.4);
        --sp-violet: #8b5cf6;
        --sp-ease: cubic-bezier(0.32, 0.72, 0, 1);
        --sp-out: cubic-bezier(0.16, 1, 0.3, 1);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        perspective: 1000px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Hiragino Sans',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      html.dark #splash {
        --sp-bg: #111118;
        --sp-face: #1e1e2e;
        --sp-line: rgba(255, 255, 255, 0.09);
        --sp-edge: rgba(255, 255, 255, 0.08);
        --sp-text: #f5f5f7;
        --sp-muted: #8e8e99;
        --sp-blue: #89b4fa;
        --sp-green: #a6e3a1;
        --sp-violet: #cba6f7;
        --sp-gridline: rgba(255, 255, 255, 0.11);
        --sp-glass: rgba(255, 255, 255, 0.05);
        --sp-rim-hi: rgba(255, 255, 255, 0.4);
        --sp-rim-lo: rgba(255, 255, 255, 0.1);
        --sp-rim: rgba(255, 255, 255, 0.14);
        --sp-inner: rgba(255, 255, 255, 0.07);
      }
      #splash::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--sp-bg);
      }
      #splash i {
        display: block;
      }
      #splash .sp-defs {
        position: absolute;
        width: 0;
        height: 0;
      }

      /* 3D world: an endless spreadsheet floor receding to the horizon, a few cells softly lit.
         It's what the glass panes refract, and it drifts toward the camera the whole time. */
      #splash .sp-world {
        position: absolute;
        inset: 0;
        overflow: hidden;
        perspective: 700px;
        perspective-origin: 50% 20%;
        pointer-events: none;
      }
      #splash .sp-floor {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3200px;
        height: 3200px;
        margin: -1600px 0 0 -1600px;
        transform: translateY(300px) rotateX(76deg);
        -webkit-mask-image: radial-gradient(closest-side, #000 25%, transparent 100%);
        mask-image: radial-gradient(closest-side, #000 25%, transparent 100%);
        animation: sp-floor-in 2000ms var(--sp-out) both;
      }
      #splash .sp-floor-grid {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, var(--sp-gridline) 2px, transparent 2px) 0 0 / 125px 30px,
          linear-gradient(to bottom, var(--sp-gridline) 2px, transparent 2px) 0 0 / 125px 30px;
        animation: sp-drift 2600ms cubic-bezier(0.2, 0.6, 0.35, 1) both;
      }
      #splash .sp-lit {
        position: absolute;
        left: calc(1625px + var(--cx) * 125px + 2px);
        top: calc(1110px + var(--cy) * 60px + 2px);
        width: 123px;
        height: 28px;
        border-radius: 4px;
        background: var(--lit);
        box-shadow: 0 0 60px 10px var(--lit);
        opacity: 0.55;
        animation: sp-lit 900ms var(--sp-out) both;
        animation-delay: calc(500ms + var(--d) * 70ms);
      }
      #splash .sp-lit-b {
        --lit: color-mix(in srgb, var(--sp-blue) 55%, transparent);
      }
      #splash .sp-lit-g {
        --lit: color-mix(in srgb, var(--sp-green) 55%, transparent);
      }
      #splash .sp-lit-v {
        --lit: color-mix(in srgb, var(--sp-violet) 50%, transparent);
      }

      /* Liquid glass: translucent tint + backdrop blur/saturation, bright rim light, soft inner glow.
         Chromium additionally bends the backdrop at the rim through an SVG displacement lens. */
      #splash .sp-card,
      #splash .sp-formula {
        background: var(--sp-glass);
        -webkit-backdrop-filter: blur(12px) saturate(1.9);
        backdrop-filter: blur(12px) saturate(1.9);
        box-shadow:
          inset 0 1px 1px var(--sp-rim-hi),
          inset 0 -1px 1px var(--sp-rim-lo),
          inset 0 0 0 1px var(--sp-rim),
          inset 0 0 22px var(--sp-inner),
          0 18px 44px rgba(0, 0, 0, 0.12);
      }
      html.lg-lens #splash .sp-card {
        backdrop-filter: url(#sp-lens-card) blur(3px) saturate(1.9);
      }
      html.lg-lens #splash .sp-formula {
        backdrop-filter: url(#sp-lens-pill) blur(2px) saturate(1.9);
      }

      /* Idle float: the panes breathe slightly in 3D once they've landed */
      #splash .sp-float {
        animation: sp-float 8s ease-in-out 1300ms infinite;
      }
      #splash .sp-card-wrap > .sp-float {
        position: absolute;
        inset: 0;
      }
      #splash .sp-float-pill {
        animation-duration: 7s;
        animation-delay: 1000ms;
        animation-direction: reverse;
      }

      /* Formula: characters resolve out of a soft blur, one after another */
      #splash .sp-formula {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 280px;
        height: 44px;
        margin-bottom: 30px;
        border-radius: 22px;
        font:
          500 15px/1 ui-monospace,
          'SF Mono',
          Menlo,
          monospace;
        color: var(--sp-muted);
        animation: sp-appear 900ms var(--sp-out) 300ms both;
      }
      #splash .sp-formula .sp-fx {
        margin-right: 12px;
        padding-right: 12px;
        border-right: 1px solid var(--sp-line);
        font:
          italic 600 14px/1 Georgia,
          'Times New Roman',
          serif;
        color: var(--sp-muted);
      }
      #splash .sp-formula span:not(.sp-fx) {
        animation: sp-char 500ms var(--sp-out) both;
        animation-delay: calc(700ms + var(--i) * 30ms);
      }
      #splash .sp-formula .sp-fn {
        color: var(--sp-text);
      }
      #splash .sp-formula .sp-a {
        color: var(--sp-blue);
      }
      #splash .sp-formula .sp-b {
        color: var(--sp-green);
      }

      /* The card: tilts in from 3D space and settles flat (its base style is the settled state) */
      #splash .sp-card-wrap {
        position: relative;
        width: 288px;
        height: 88px;
        perspective: 900px;
        transform: rotateX(0deg) rotateY(0deg) translateY(0);
        animation:
          sp-card-in 1300ms var(--sp-out) both,
          sp-lift 900ms var(--sp-ease) 1700ms both;
      }
      #splash .sp-shadow {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: -18px;
        height: 24px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.18);
        filter: blur(14px);
        animation: sp-shadow-in 1300ms var(--sp-out) both;
      }
      html.dark #splash .sp-shadow {
        background: rgba(0, 0, 0, 0.6);
      }
      #splash .sp-card {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 18px;
        animation: sp-appear 1000ms var(--sp-out) both;
      }
      /* Specular highlight on the glass */
      #splash .sp-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          120% 90% at 18% -10%,
          rgba(255, 255, 255, 0.55),
          transparent 55%
        );
        pointer-events: none;
      }
      html.dark #splash .sp-card::before {
        background: radial-gradient(
          120% 90% at 18% -10%,
          rgba(255, 255, 255, 0.12),
          transparent 55%
        );
      }
      /* One slow sheen across the face once the merge lands */
      #splash .sp-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 70%
        );
        transform: translateX(-120%);
        animation: sp-sheen 1400ms var(--sp-ease) 2000ms forwards;
        pointer-events: none;
      }
      html.dark #splash .sp-card::after {
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.08) 50%,
          transparent 70%
        );
      }

      /* Grid hairlines: retract from their centers as the cells merge */
      #splash .sp-vline,
      #splash .sp-hline {
        position: absolute;
        background: var(--sp-line);
      }
      #splash .sp-vline {
        top: 0;
        width: 1px;
        height: 100%;
        transform: scaleY(0);
        animation: sp-vline 520ms cubic-bezier(0.65, 0, 0.35, 1) both;
        animation-delay: calc(1450ms + var(--k) * 45ms);
      }
      #splash .sp-hline {
        left: 0;
        top: 44px;
        width: 100%;
        height: 1px;
        transform: scaleX(0);
        animation: sp-hline 560ms cubic-bezier(0.65, 0, 0.35, 1) 1420ms both;
      }

      /* A1 / B1 values: appear, pick up their reference tint, then dissolve into the merge */
      #splash .sp-val {
        position: absolute;
        top: 0;
        width: 72px;
        height: 44px;
        padding-left: 11px;
        display: flex;
        align-items: center;
        font-size: 14px;
        color: var(--sp-text);
        opacity: 0;
      }
      #splash .sp-val::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      #splash .sp-val-a {
        left: 0;
        animation: sp-val 1500ms var(--sp-out) 450ms both;
      }
      #splash .sp-val-b {
        left: 72px;
        animation: sp-val 1430ms var(--sp-out) 520ms both;
      }
      #splash .sp-val-a::before {
        background: var(--sp-blue);
        animation: sp-tint 700ms ease 960ms both;
      }
      #splash .sp-val-b::before {
        background: var(--sp-green);
        animation: sp-tint 580ms ease 1080ms both;
      }

      /* Merged-cell result */
      #splash .sp-result {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: var(--sp-text);
        animation: sp-result 900ms var(--sp-out) 1650ms both;
      }
      #splash .sp-result .sp-accent {
        background: linear-gradient(120deg, var(--sp-blue), var(--sp-green));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Selection outline: lands on A1, glides to B1, then grows over the whole range */
      #splash .sp-sel {
        position: absolute;
        left: -1px;
        top: -1px;
        width: 290px;
        height: 90px;
        border: 2px solid var(--sp-blue);
        border-radius: 19px;
        box-shadow: 0 0 18px color-mix(in srgb, var(--sp-blue) 45%, transparent);
        animation: sp-sel 1000ms var(--sp-ease) 600ms both;
      }

      #splash .sp-tagline {
        margin-top: 34px;
        font-size: 15px;
        letter-spacing: -0.01em;
        color: var(--sp-muted);
        text-shadow:
          0 0 10px var(--sp-bg),
          0 0 20px var(--sp-bg);
        animation: sp-rise 900ms var(--sp-out) 1900ms both;
      }

      /* Exit — "the floor becomes the sheet": the glass panes float up and dissolve, the floor stands
         up to face the camera and lands exactly on the real grid (traced by src/splash.ts), then the
         backdrop clears onto the app. Glass fades on itself (never an ancestor) to keep its backdrop. */
      #splash.splash-out {
        pointer-events: none;
      }
      #splash.splash-out::before {
        animation: sp-fade-out 420ms ease 480ms forwards;
      }
      #splash.splash-out .sp-card-wrap {
        animation: sp-rise-away 650ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #splash.splash-out .sp-float-pill {
        animation: sp-pill-away 600ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #splash.splash-out .sp-card,
      #splash.splash-out .sp-formula,
      #splash.splash-out .sp-sel,
      #splash.splash-out .sp-shadow {
        animation: sp-fade-out 420ms ease forwards;
      }
      #splash.splash-out .sp-tagline,
      #splash.splash-out .sp-lit {
        animation: sp-fade-out 300ms ease forwards;
      }
      /* On the way up, the uniform floor grid gives way to the trace of the real sheet (src/splash.ts) */
      #splash.splash-out .sp-floor-grid {
        animation: sp-fade-out 420ms ease 120ms forwards;
      }
      #splash .sp-floor-real {
        position: absolute;
        opacity: 0;
        animation: sp-appear 480ms ease 200ms forwards;
      }
      #splash.splash-out .sp-floor {
        animation:
          sp-floor-to-sheet 950ms cubic-bezier(0.65, 0, 0.35, 1) 60ms forwards,
          sp-floor-out 320ms ease 1000ms forwards;
      }
      #splash.splash-fade {
        animation: sp-fade-out 200ms ease forwards;
      }

      @keyframes sp-rise-away {
        from {
          transform: rotateX(0deg) rotateY(0deg) translateY(0);
          scale: 1.04;
        }
        to {
          transform: rotateX(-14deg) rotateY(0deg) translateY(-70px);
          scale: 1.12;
        }
      }
      @keyframes sp-pill-away {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-60px);
        }
      }
      @keyframes sp-floor-to-sheet {
        from {
          transform: translate(0px, 300px) rotateX(76deg) scale(1);
        }
        to {
          transform: translate(0px, 0px) rotateX(0deg) scale(1);
        }
      }
      @keyframes sp-floor-out {
        to {
          opacity: 0;
        }
      }
      @keyframes sp-char {
        from {
          opacity: 0;
          filter: blur(4px);
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: none;
        }
      }
      @keyframes sp-card-in {
        from {
          transform: rotateX(48deg) rotateY(-26deg) translateY(60px);
        }
        to {
          transform: rotateX(0deg) rotateY(0deg) translateY(0);
        }
      }
      @keyframes sp-appear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes sp-floor-in {
        from {
          opacity: 0;
          transform: translateY(520px) rotateX(86deg);
        }
        to {
          opacity: 1;
          transform: translateY(300px) rotateX(76deg);
        }
      }
      @keyframes sp-drift {
        from {
          transform: translateY(-180px);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes sp-lit {
        from {
          opacity: 0;
          transform: translateZ(40px);
        }
        to {
          opacity: 0.55;
          transform: none;
        }
      }
      @keyframes sp-float {
        0%,
        100% {
          transform: none;
        }
        33% {
          transform: rotateX(5deg) rotateY(-7deg) translateY(-3px);
        }
        66% {
          transform: rotateX(-4deg) rotateY(6deg) translateY(3px);
        }
      }
      @keyframes sp-lift {
        from {
          scale: 1;
        }
        to {
          scale: 1.04;
        }
      }
      @keyframes sp-shadow-in {
        from {
          opacity: 0;
          transform: scaleX(0.6) translateY(24px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sp-sheen {
        to {
          transform: translateX(120%);
        }
      }
      @keyframes sp-vline {
        from {
          transform: scaleY(1);
        }
        to {
          transform: scaleY(0);
        }
      }
      @keyframes sp-hline {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }
      @keyframes sp-val {
        0% {
          opacity: 0;
          transform: translateY(4px);
          filter: blur(3px);
        }
        25% {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
        70% {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
        100% {
          opacity: 0;
          transform: translateX(24px) scale(0.96);
          filter: blur(4px);
        }
      }
      @keyframes sp-tint {
        0% {
          opacity: 0;
        }
        25% {
          opacity: 0.1;
        }
        60% {
          opacity: 0.1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes sp-result {
        from {
          opacity: 0;
          filter: blur(10px);
          transform: scale(0.94);
          letter-spacing: 0.06em;
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: none;
          letter-spacing: -0.025em;
        }
      }
      @keyframes sp-sel {
        0% {
          opacity: 0;
          width: 74px;
          height: 46px;
          border-radius: 4px;
          transform: translate(0, 0) scale(1.15);
        }
        15% {
          opacity: 1;
          width: 74px;
          height: 46px;
          border-radius: 4px;
          transform: translate(0, 0) scale(1);
        }
        49% {
          width: 74px;
          height: 46px;
          border-radius: 4px;
          transform: translate(0, 0);
        }
        60% {
          width: 74px;
          height: 46px;
          border-radius: 4px;
          transform: translate(72px, 0);
        }
        70% {
          width: 74px;
          height: 46px;
          border-radius: 4px;
          transform: translate(72px, 0);
        }
        100% {
          opacity: 1;
          width: 290px;
          height: 90px;
          border-radius: 19px;
          transform: translate(0, 0);
        }
      }
      @keyframes sp-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sp-fade-out {
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash *::before,
        #splash *::after {
          animation: none !important;
        }
        #splash .sp-formula {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="sp-defs" width="0" height="0" aria-hidden="true">
        <filter
          id="sp-lens-card"
          x="0"
          y="0"
          width="288"
          height="88"
          filterUnits="userSpaceOnUse"
          color-interpolation-filters="sRGB"
